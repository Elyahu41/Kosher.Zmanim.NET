name: Publish to NuGet

# Runs when a GitHub release is published. The release tag (for example v3.1.0) must match <Version> in Kosher.Zmanim.csproj.
# Uses nuget.org Trusted Publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing): no API key is stored.
# GitHub's OIDC token is exchanged for a short-lived key, which nuget.org only issues to this repository and workflow file
# (configured on nuget.org under Trusted Publishing: owner Elyahu41, repository Kosher.Zmanim.NET, workflow publish.yml).
on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request the GitHub OIDC token used by Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check the version matches the tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Kosher.Zmanim/Kosher.Zmanim.csproj)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack src/Kosher.Zmanim/Kosher.Zmanim.csproj --configuration Release --output artifacts
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Elyahu41 # nuget.org profile name
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
