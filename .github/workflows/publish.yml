name: Publish to NuGet

# Runs when a GitHub release is published. The release tag (for example v3.1.0) must match <Version> in Kosher.Zmanim.csproj.
# Requires a repository secret named NUGET_API_KEY (an API key from https://www.nuget.org/account/apikeys).
on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check the version matches the tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Kosher.Zmanim/Kosher.Zmanim.csproj)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        run: dotnet pack src/Kosher.Zmanim/Kosher.Zmanim.csproj --configuration Release --output artifacts
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
